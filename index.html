<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Tasks</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #fff; --text: #1d1d1b; --muted: #77756f;
    --line: #e4e2db; --accent: #3a6ff7; --today: #fff7e0; --today-line: #f0c95a;
    --danger: #d64545; --warn: #c27c0e; --ok: #2e8a4f;
  }
  :root { color-scheme: only light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* Passphrase screen */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #lock form { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
               padding: 24px; width: 100%; max-width: 280px; text-align: center; }
  #lock input { width: 100%; font-size: 18px; text-align: center; margin-bottom: 8px;
                padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  #lockMsg { color: var(--danger); min-height: 1.4em; margin: 8px 0 0; font-size: 13px; }

  /* Board */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  #week { color: var(--muted); }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.err { color: var(--danger); }
  .link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer;
          text-decoration: underline; font-size: 12px; }

  #board { display: grid; gap: 12px; padding: 0 16px 24px;
           grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px; display: flex; flex-direction: column; min-height: 140px; }
  .card.today { background: var(--today); border-color: var(--today-line); }
  .card.deadlines { border-top: 3px solid var(--danger); }
  .card.scratch { grid-column: 1 / -1; min-height: 0; border-top: 3px solid var(--accent); }
  .card.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .card h2 small { color: var(--muted); font-weight: normal; }
  ul { list-style: none; margin: 0; padding: 0; flex: 1; }
  li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0;
       border-bottom: 1px solid var(--line); }
  li[draggable="true"] { cursor: grab; }
  li.dragging { opacity: .4; }
  li input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; flex: none; cursor: pointer; }
  li .text { flex: 1; cursor: pointer; word-break: break-word; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  li .due { font-size: 12px; white-space: nowrap; color: var(--muted); }
  li .due.soon { color: var(--warn); }
  li .due.late { color: var(--danger); font-weight: 600; }

  li.editing { flex-wrap: wrap; }
  li.editing input[type=text] { flex: 1 1 100%; }
  .edit-row { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  input[type=text], input[type=date], select {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); min-width: 0; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px;
         padding: 5px 10px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }

  form.add { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  form.add input[type=text] { flex: 1 1 120px; }
  form.add input[type=date] { flex: 0 1 140px; }

  @media (max-width: 560px) {
    #board { grid-template-columns: 1fr; }
    input[type=text], input[type=date], select { font-size: 16px; } /* stop iOS zoom */
  }
</style>
</head>
<body>

<div id="lock">
  <form id="lockForm">
    <p style="margin-top:0">Enter passphrase</p>
    <input id="pass" type="password" autocomplete="current-password" autofocus>
    <button class="btn primary" id="unlockBtn">Unlock</button>
    <p id="lockMsg"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Tasks</h1>
    <span id="week"></span>
    <span id="status"></span>
    <button class="link" id="sync" title="Check for changes now">↻ Refresh</button>
    <button class="link" id="logout" title="Forget the passphrase on this device">Lock</button>
  </header>
  <main id="board"></main>
</div>

<script src="crypto.js"></script>
<script src="config.js"></script>
<script>
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const SCRATCH = -1;          // task.day for the scratch pad (not tied to a day)
const CREDS_KEY = "tasks-creds";
const FILE = "tasks.json";

let creds = null;            // { token, gistId }, decrypted from config.js
let state = { version: 0, tasks: [], deadlines: [] };
let editing = null;          // id of the item currently being edited
let saving = false, pending = false;

// ---------- this device remembers the unlocked credentials ----------
function loadCreds() { try { return JSON.parse(localStorage.getItem(CREDS_KEY)); } catch { return null; } }
function storeCreds(c) { try { localStorage.setItem(CREDS_KEY, JSON.stringify(c)); } catch {} }
function clearCreds() { try { localStorage.removeItem(CREDS_KEY); } catch {} }

// ---------- dates ----------
function weekStart(d = new Date()) {
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
  return s;
}
function todayIndex() { return (new Date().getDay() + 6) % 7; }
function fmt(d) { return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
function parseDate(str) { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d); }

// ---------- GitHub Gist ----------
// The whole board is one JSON file in a secret gist. Throws { status } on failure.
async function gist(method, body) {
  const fresh = method === "GET" ? `?t=${Date.now()}` : "";
  const res = await fetch(`https://api.github.com/gists/${creds.gistId}${fresh}`, {
    method,
    cache: "no-store",
    headers: { Authorization: `Bearer ${creds.token}`, Accept: "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw { status: res.status };
  return res.json();
}

async function readBoard() {
  const g = await gist("GET");
  const data = JSON.parse(g.files[FILE]?.content || "{}");
  return { version: data.version || 0, tasks: data.tasks || [], deadlines: data.deadlines || [] };
}

function writeBoard(board) {
  return gist("PATCH", { files: { [FILE]: { content: JSON.stringify(board, null, 1) } } });
}

function setStatus(text, isErr = false) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = isErr ? "err" : "";
}

async function unlock(c) {
  creds = c;
  try {
    state = await readBoard();
  } catch (e) {
    if (e.status === 401 || e.status === 404) return "GitHub refused the token (expired or deleted?). Re-run setup.";
    return "Can't reach GitHub";
  }
  storeCreds(c);
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  cleanup();
  render();
  if (window.innerWidth <= 560) {
    document.querySelector(".card.today")?.scrollIntoView({ block: "start" });
  }
  return null;
}

// Done tasks disappear for good: scratch pad ones at the start of each day,
// day ones at the start of each week (Monday).
function cleanup() {
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const week = weekStart().getTime();
  const kept = state.tasks.filter(t =>
    !t.done || new Date(t.doneAt).getTime() >= (t.day === SCRATCH ? dayStart : week));
  if (kept.length !== state.tasks.length) { state.tasks = kept; commit(); }
}

// Apply a local change: re-render now, sync to GitHub in the background.
function commit() { render(); pending = true; flush(); }

// Each save first checks the gist's version. If another device saved since we
// last loaded, take theirs instead of overwriting it. (A remote version lower
// than ours is just GitHub returning a slightly stale copy, so ignore it.)
async function flush() {
  if (saving) return;
  saving = true;
  while (pending) {
    pending = false;
    setStatus("Saving…");
    try {
      const remote = await readBoard();
      if (remote.version > state.version) {
        state = remote;
        editing = null;
        cleanup();
        render();
        setStatus("Changed on another device — reloaded, redo your last edit", true);
        continue;
      }
      const next = { ...state, version: state.version + 1 };
      await writeBoard(next);
      state.version = next.version;
      setStatus("Saved");
    } catch (e) {
      if (e.status === 401) { clearCreds(); location.reload(); return; }
      setStatus("Not saved — retrying…", true);
      pending = true;
      await new Promise(r => setTimeout(r, 4000));
    }
  }
  saving = false;
}

// Pick up edits made on other devices: every 20s while the page is visible,
// and straight away when coming back to it or tapping ↻.
const POLL_MS = 20000;
async function refresh() {
  if (!creds || saving || pending || editing) return;
  try {
    const fresh = await readBoard();
    if (fresh.version > state.version) { state = fresh; cleanup(); render(); }
    setStatus("Synced " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch {
    setStatus("Offline — will retry", true);
  }
}
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("focus", refresh);
window.addEventListener("pageshow", refresh);
window.addEventListener("online", refresh);

// ---------- rendering ----------
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of children) if (c != null) node.append(c);
  return node;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function render() {
  const start = weekStart();
  const end = new Date(start); end.setDate(end.getDate() + 6);
  document.getElementById("week").textContent = `${fmt(start)} – ${fmt(end)}`;

  const board = document.getElementById("board");
  board.replaceChildren();
  const today = todayIndex();

  const scratch = el("section", { className: "card scratch" });
  scratch.dataset.day = SCRATCH;
  scratch.append(el("h2", {}, "Scratch pad", el("small", { textContent: "done items clear each day" })));
  const sList = el("ul");
  for (const t of state.tasks.filter(t => t.day === SCRATCH)) sList.append(taskRow(t));
  scratch.append(sList, addTaskForm(SCRATCH));
  makeDropZone(scratch, SCRATCH);
  board.append(scratch);

  DAYS.forEach((name, i) => {
    const date = new Date(start); date.setDate(date.getDate() + i);
    const card = el("section", { className: "card" + (i === today ? " today" : "") });
    card.dataset.day = i;
    card.append(el("h2", {}, name, el("small", { textContent: fmt(date) })));
    const list = el("ul");
    for (const t of state.tasks.filter(t => t.day === i)) list.append(taskRow(t));
    card.append(list, addTaskForm(i));
    makeDropZone(card, i);
    board.append(card);
  });

  const dl = el("section", { className: "card deadlines" });
  dl.append(el("h2", { textContent: "Deadlines" }));
  const list = el("ul");
  const sorted = [...state.deadlines].sort((a, b) =>
    (a.date || "9999") < (b.date || "9999") ? -1 : (a.date || "9999") > (b.date || "9999") ? 1 : 0);
  for (const d of sorted) list.append(deadlineRow(d));
  dl.append(list, addDeadlineForm());
  makeDropZone(dl, "deadlines");
  board.append(dl);

  board.querySelector("li.editing input[type=text]")?.focus();
}

function taskRow(t) {
  if (editing === t.id) return taskEditor(t);
  const li = el("li", { className: t.done ? "done" : "", draggable: true });
  const box = el("input", { type: "checkbox", checked: t.done, title: "Done" });
  box.onchange = () => {
    t.done = box.checked;
    t.doneAt = t.done ? new Date().toISOString() : null;
    commit();
  };
  const text = el("span", { className: "text", textContent: t.text, title: "Tap to edit" });
  text.onclick = () => { editing = t.id; render(); };
  li.ondragstart = e => { e.dataTransfer.setData("text/plain", t.id); li.classList.add("dragging"); };
  li.ondragend = () => li.classList.remove("dragging");
  li.append(box, text);
  return li;
}

function taskEditor(t) {
  const li = el("li", { className: "editing" });
  const input = el("input", { type: "text", value: t.text });
  const day = el("select", {},
    el("option", { value: SCRATCH, textContent: "Scratch pad", selected: t.day === SCRATCH }),
    ...DAYS.map((d, i) => el("option", { value: i, textContent: d, selected: i === t.day })),
    el("option", { value: "deadlines", textContent: "Deadlines" }));
  const save = () => {
    const v = input.value.trim();
    if (v) { t.text = v; moveTask(t, day.value === "deadlines" ? "deadlines" : Number(day.value)); }
    editing = null; commit();
  };
  input.onkeydown = e => { if (e.key === "Enter") save(); if (e.key === "Escape") { editing = null; render(); } };
  li.append(input, el("div", { className: "edit-row" },
    day,
    button("Save", "primary", save),
    button("Cancel", "", () => { editing = null; render(); }),
    button("Delete", "danger", () => {
      state.tasks = state.tasks.filter(x => x.id !== t.id); editing = null; commit();
    }),
  ));
  return li;
}

function addTaskForm(day) {
  const input = el("input", { type: "text", placeholder: "Add task" });
  const form = el("form", { className: "add" }, input);
  form.onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    state.tasks.push({ id: uid(), text: v, day, done: false, doneAt: null });
    commit();
    document.querySelector(`#board .card[data-day="${day}"] form.add input`).focus();
  };
  return form;
}

function makeDropZone(card, day) {
  card.ondragover = e => { e.preventDefault(); card.classList.add("over"); };
  card.ondragleave = e => { if (!card.contains(e.relatedTarget)) card.classList.remove("over"); };
  card.ondrop = e => {
    e.preventDefault();
    card.classList.remove("over");
    const t = state.tasks.find(x => x.id === e.dataTransfer.getData("text/plain"));
    if (!t || t.day === day) return;
    moveTask(t, day);
    commit();
  };
}

// Move a task to the end of another card: a day, the scratch pad, or
// "deadlines" (where it becomes an undated deadline).
function moveTask(t, target) {
  if (t.day === target) return;
  state.tasks = state.tasks.filter(x => x !== t);
  if (target === "deadlines") {
    state.deadlines.push({ id: t.id, text: t.text, date: null });
  } else {
    t.day = target;
    state.tasks.push(t);
  }
}

function dueLabel(date) {
  if (!date) return { text: "", cls: "" };
  const days = Math.round((parseDate(date) - parseDate(new Date().toLocaleDateString("en-CA"))) / 86400000);
  const when = fmt(parseDate(date));
  if (days < 0) return { text: `${when} · ${-days}d late`, cls: "late" };
  if (days === 0) return { text: `${when} · today`, cls: "late" };
  if (days <= 3) return { text: `${when} · ${days}d`, cls: "soon" };
  return { text: `${when} · ${days}d`, cls: "" };
}

function deadlineRow(d) {
  if (editing === d.id) return deadlineEditor(d);
  const li = el("li");
  const box = el("input", { type: "checkbox", title: "Done (removes it)" });
  box.onchange = () => { state.deadlines = state.deadlines.filter(x => x.id !== d.id); commit(); };
  const text = el("span", { className: "text", textContent: d.text, title: "Tap to edit" });
  text.onclick = () => { editing = d.id; render(); };
  const due = dueLabel(d.date);
  li.append(box, text, el("span", { className: "due " + due.cls, textContent: due.text }));
  return li;
}

function deadlineEditor(d) {
  const li = el("li", { className: "editing" });
  const input = el("input", { type: "text", value: d.text });
  const date = el("input", { type: "date", value: d.date || "" });
  const save = () => {
    const v = input.value.trim();
    if (v) { d.text = v; d.date = date.value || null; }
    editing = null; commit();
  };
  input.onkeydown = e => { if (e.key === "Enter") save(); if (e.key === "Escape") { editing = null; render(); } };
  li.append(input, el("div", { className: "edit-row" },
    date,
    button("Save", "primary", save),
    button("Cancel", "", () => { editing = null; render(); }),
    button("Delete", "danger", () => {
      state.deadlines = state.deadlines.filter(x => x.id !== d.id); editing = null; commit();
    }),
  ));
  return li;
}

function addDeadlineForm() {
  const input = el("input", { type: "text", placeholder: "Add deadline" });
  const date = el("input", { type: "date" });
  const form = el("form", { className: "add" }, input, date, el("button", { className: "btn", textContent: "Add" }));
  form.onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    state.deadlines.push({ id: uid(), text: v, date: date.value || null });
    commit();
  };
  return form;
}

function button(label, cls, onclick) {
  return el("button", { type: "button", className: "btn " + cls, textContent: label, onclick });
}

// ---------- start ----------
document.getElementById("sync").onclick = refresh;
document.getElementById("logout").onclick = () => { clearCreds(); location.reload(); };

document.getElementById("lockForm").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("lockMsg");
  const input = document.getElementById("pass");
  if (!window.TASKS_CONFIG) { msg.textContent = "Not set up yet: run setup.html and upload config.js"; return; }
  msg.textContent = "Unlocking…";
  let c;
  try { c = await decryptConfig(window.TASKS_CONFIG, input.value); }
  catch { msg.textContent = "Wrong passphrase"; input.value = ""; return; }
  msg.textContent = (await unlock(c)) || "";
};

const saved = loadCreds();
if (saved) unlock(saved).then(err => { if (err) { clearCreds(); document.getElementById("lockMsg").textContent = err; } });
</script>
</body>
</html>
