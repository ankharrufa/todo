name = "tasks"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The page (public/index.html) is served as a static asset; anything that
# isn't a file (i.e. /api/*) falls through to the Worker.
[assets]
directory = "./public"

# Where the task list lives. Create the namespace once with
#   npx wrangler kv namespace create TASKS
# and paste the id it prints below.
[[kv_namespaces]]
binding = "TASKS"
id = "PASTE_KV_NAMESPACE_ID_HERE"
